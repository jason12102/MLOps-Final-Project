version: "3.9"

services:
  h2o-demo:
    build: .
    container_name: h2o-automl-demo
    ports:
      - "54321:54321"   # H2O Flow UI
      - "8888:8888"     # Jupyter Lab
    volumes:
      # Mount notebooks folder so edits persist outside the container
      - ./notebooks:/app/notebooks
      # Mount results folder so saved models/leaderboards persist
      - ./results:/app/h2o_automl_results
    environment:
      - JAVA_OPTS=-Xmx4g
    mem_limit: 6g
    restart: unless-stopped
