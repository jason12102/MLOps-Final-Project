version: "3.9"

services:
  h2o-demo:
    build: .
    container_name: h2o-automl-demo
    ports:
      - "54321:54321"   # H2O Flow UI
      - "8888:8888"     # Jupyter Lab
    volumes:
      # Versioned CSVs from the repo — read-only
      - ../data_versioning/outputs:/app/data_versioning/outputs:ro
      # Notebooks folder — editable
      - ./notebooks:/app/notebooks
      # Results persist outside the container
      - ./results:/app/h2o_automl_results
    mem_limit: 6g
    restart: unless-stopped
