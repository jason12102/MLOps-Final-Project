version: "3.8"

services:
  model-serving:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetes-model-serving
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model/GBM_1_AutoML_3_20260525_194002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
