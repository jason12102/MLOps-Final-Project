version: "3.8"

services:
  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetes-monitoring
    volumes:
      - ./workspace:/app/workspace
      - ../data_versioning/outputs:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - model-serving
    networks:
      - diabetes-network

  monitoring-ui:
    image: python:3.11-slim
    container_name: diabetes-monitoring-ui
    working_dir: /app
    command: >
      bash -c "pip install evidently[ui] && evidently ui --host 0.0.0.0 --port 8001 --workspace /app/workspace"
    ports:
      - "8001:8001"
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - monitoring
    networks:
      - diabetes-network

  model-serving:
    build:
      context: ../model_serving
      dockerfile: Dockerfile
    container_name: diabetes-model-serving
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - diabetes-network

networks:
  diabetes-network:
    driver: bridge
